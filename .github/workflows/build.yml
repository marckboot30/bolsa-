name: Análise de Ações APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk AnaliseAcoes.apk
      # só vira versão nova no celular quando o commit pedir "[lançar]" (ou rodando à mão);
      # assim dá para juntar várias mudanças numa atualização só
      - name: Publicar para baixar no celular
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[lançar]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Análise de Ações v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: AnaliseAcoes.apk
